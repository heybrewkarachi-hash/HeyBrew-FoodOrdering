# Deploy from monorepo root (Docker build context = repo root).
# Railway: Settings → Root Directory = empty / "."
#          Dockerfile path = server/Dockerfile

[build]
builder = "DOCKERFILE"
dockerfilePath = "server/Dockerfile"
# Only rebuild API when backend (or shared) sources change — not client/admin.
watchPatterns = [
  "server/**",
  "packages/shared/**",
  "package.json",
  "package-lock.json",
  "railway.toml",
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
